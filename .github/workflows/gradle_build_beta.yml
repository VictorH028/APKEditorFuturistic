name: Build Beta Jars

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build CLI and JavaFX jars
        run: |
          chmod +x gradlew
          ./gradlew fatJar guiFatJar --no-daemon
          ls -lh build/libs build/javafx

      - name: Package beta jars
        run: |
          mkdir -p dist/APKEditor/javafx
          cp build/libs/*.jar dist/APKEditor/
          cp build/javafx/*.jar dist/APKEditor/javafx/
          ls -lh dist/APKEditor dist/APKEditor/javafx

      - name: Upload beta artifacts
        uses: actions/upload-artifact@v4
        with:
          name: APKEditor
          path: dist/APKEditor
          if-no-files-found: error
